<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<body data-page="modulos">
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Catálogo de módulos</span>
        <h1>Diez módulos sobre una integración base</h1>
        <p>Cada módulo indica qué incluye, de qué depende, cuánto cuesta implementarlo y su mensualidad. Agréguelos a la cotización o pruebe su prototipo interactivo.</p>
        <div class="row wrap mt-2">
          <div class="segmented" id="filter" role="tablist" aria-label="Filtrar módulos">
            <button class="active" data-f="all">Todos</button>
            <button data-f="atencion">Atención</button>
            <button data-f="comercio">Comercio</button>

        </div>

    <section class="section tight" style="padding-top:12px">
      <div class="container modules-layout">
        <nav class="modules-toc" id="toc" aria-label="Índice de módulos"></nav>
        <div id="module-list" class="stack"></div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/modules.js"></script>
