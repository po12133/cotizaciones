<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Catalogia</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="dash">
  <div id="boot"><span class="spinner"></span></div>
  <div class="shell">
    <aside class="side" id="side" aria-label="Menú">
      <a class="logo side-logo" href="#/inicio"><span class="logo-mark" data-brand-short>C</span><span data-brand>Catalogia</span></a>
      <div class="side-biz" id="sideBiz"></div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-plan" id="sidePlan"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="top">
        <button class="icon-btn side-toggle" id="sideToggle" aria-label="Abrir menú"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="top-title"><h1 id="pageTitle">Inicio</h1><span id="pageSub"></span></div>
        <div class="top-right">
          <span class="demo-tag" title="Datos guardados solo en este navegador">Demo</span>
          <div class="dropdown" id="notifDd"><button class="icon-btn" id="notifBtn" aria-label="Notificaciones"></button><div class="dropdown-menu notif-menu" id="notifMenu"></div></div>
          <div class="dropdown" id="userDd"><button class="user-btn" id="userBtn"></button><div class="dropdown-menu" id="userMenu"></div></div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="data/plans.js"></script>
  <script src="data/templates.js"></script>
  <script src="data/products.js"></script>
  <script src="js/images.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/products.js"></script>
  <script src="js/catalogs.js"></script>
  <script src="js/subscriptions.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script src="js/integrations.js"></script>
  <script src="js/views/products-view.js"></script>
  <script src="js/views/catalogs-view.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/views/whatsapp-view.js"></script>
  <script src="js/views/stats-view.js"></script>
  <script src="js/views/subscription-view.js"></script>
  <script>CA.dash.start();</script>
</body>
</html>
