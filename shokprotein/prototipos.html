<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipos SHOKPROTEIN</title>
<meta name="description" content="Prototipos navegables del nuevo sitio web de SHOKPROTEIN: página principal, catálogo, detalle de producto, contacto y panel administrativo. Uso demostrativo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   IDENTIDAD SHOKPROTEIN — los 4 colores oficiales
   --y  #D5AF04 amarillo principal · --y2 #B39302 amarillo sombreado
   --k  #121112 negro principal    · --k0 #050505 negro intenso
   ===================================================================== */
:root{
  --y:#D5AF04;--y2:#B39302;--k:#121112;--k0:#050505;
  --k2:#1b1a1b;--k3:#262426;--ln:#2a282a;--ln2:#3b383b;
  --mu:#a39e93;--mu2:#77736b;--wh:#f6f3ea;--soft:#d9d4c7;--wa:#25D366;
  --fd:'Anton',Impact,'Arial Narrow',sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--k0);color:var(--wh);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
select option{background:var(--k);color:var(--wh)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;cursor:pointer}
.i{width:18px;height:18px;flex:none}

/* ============ MARCO DEL PROTOTIPO ============ */
.pbar{position:sticky;top:0;z-index:100;background:rgba(5,5,5,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:16px;padding:10px 20px}
.pbrand{flex:none;line-height:1}
.pbrand small{display:block;font-size:11px;color:var(--mu);letter-spacing:.3px;margin-top:4px}
.pnav{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
.pnav::-webkit-scrollbar{display:none}
.pnav button{flex:none;display:flex;align-items:center;gap:7px;padding:7px 11px 7px 7px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap}
.pnav button span{font-family:var(--fd);font-size:13px;width:22px;height:22px;border-radius:5px;background:var(--k);border:1px solid var(--ln2);display:grid;place-items:center;color:var(--y);line-height:1}
.pnav button:hover{color:#fff;background:var(--k)}
.pnav button.on{background:var(--y);color:var(--k0);font-weight:700}
.pnav button.on span{background:var(--k0);border-color:transparent;color:var(--y)}
.pnav .sep{width:1px;background:var(--ln2);margin:6px 5px;flex:none}
.dev{display:flex;background:var(--k);border:1px solid var(--ln2);border-radius:9px;padding:3px;flex:none}
.dev button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--mu)}
.dev button .i{width:15px;height:15px}
.dev button.on{background:var(--wh);color:var(--k0);font-weight:600}
.ribbon{background:repeating-linear-gradient(-45deg,#171503 0 14px,#121112 14px 28px);color:#e9d98a;font-size:12px;text-align:center;padding:6px 16px;border-bottom:1px solid var(--ln2)}
.ribbon b{color:#fff}
.stage{max-width:1440px;margin:0 auto;padding:18px 20px 30px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 20px;margin-bottom:14px;flex-wrap:wrap}
.ph-t{display:flex;gap:14px;align-items:flex-start;max-width:880px}
.ph-n{font-family:var(--fd);font-size:46px;line-height:.85;color:var(--y);flex:none}
.ph-t h1{font-family:var(--fd);font-weight:400;font-size:30px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.ph-t p{color:var(--mu);font-size:14px;margin-top:5px}
.ph-t .part{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--k0);background:var(--y);padding:2px 8px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--k);border:1px solid var(--ln2);color:var(--soft)}
.ph-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph-ctrl .lbl{font-size:12px;color:var(--mu)}
.seg{display:flex;background:var(--k);border:1px solid var(--ln2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:6px;font-size:13px;color:var(--mu);font-weight:500}
.seg button:hover{color:#fff}
.seg button.on{background:var(--y);color:var(--k0);font-weight:700}
.device{--top:38px;position:relative;margin:0 auto;background:var(--k0);border:1px solid var(--ln2);border-radius:14px;overflow:hidden;height:clamp(560px,calc(100vh - 120px),980px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(213,175,4,.07)}
.dtop{height:var(--top);flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#141314;border-bottom:1px solid var(--ln)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a3a3a}
.dots i:nth-child(1){background:#d9574a}.dots i:nth-child(2){background:#d9ae3e}.dots i:nth-child(3){background:#3aa57e}
.url{flex:1;max-width:540px;margin:0 auto;background:#0a0a0a;border:1px solid var(--ln);border-radius:7px;height:24px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--mu);overflow:hidden;white-space:nowrap}
.url .i{width:12px;height:12px;color:#5fd3a4}
.sb{display:none;font-size:13px;font-weight:600}
.stage[data-device=mobile] .device{--top:34px;width:410px;height:min(844px,calc(100vh - 120px));min-height:620px;border:10px solid #1c1b1c;border-radius:46px}
.stage[data-device=mobile] .dots,.stage[data-device=mobile] .url{display:none}
.stage[data-device=mobile] .dtop{justify-content:space-between;padding:0 22px;background:var(--k0);border:0}
.stage[data-device=mobile] .sb{display:block}
.vp{flex:1;overflow-y:auto;overflow-x:hidden;container:vp/inline-size;background:var(--k0);position:relative;scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}
.scr{display:none}.scr.on{display:block;min-height:100%}

/* modo captura (lo usa el script de capturas) */
body.shot .pbar,body.shot .ribbon,body.shot .phead,body.shot .dtop{display:none}
body.shot .stage{padding:0;max-width:none}
body.shot .device{border:0!important;border-radius:0!important;box-shadow:none;height:auto!important;min-height:0!important;width:var(--shot-w)!important;margin:0}
body.shot .vp{overflow:visible}
body.shot.fixh .device{height:var(--shot-h)!important}
body.shot.fixh .vp{overflow:hidden}
body.shot .tick div{animation:none}
body.shot .sh{position:relative}

/* ============ SITIO PÚBLICO ============ */
.w{max-width:1200px;margin:0 auto;padding:0 36px}
.f{fill:currentColor;stroke:none}
.sh{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.sh-in{display:flex;align-items:center;gap:28px;height:74px}
.logo{display:inline-flex;align-items:center;font-family:var(--fd);font-size:29px;letter-spacing:.6px;line-height:1;color:#fff;text-transform:uppercase;white-space:nowrap}
.logo b{font-weight:400;color:var(--y)}
.logo .i{width:22px;height:22px;color:var(--y);margin-left:3px}
.sh-nav{display:flex;gap:28px;margin-left:auto;font-family:var(--fc);font-weight:600;font-size:16.5px;letter-spacing:1.2px;text-transform:uppercase}
.sh-nav a{color:var(--soft);padding:6px 0;border-bottom:2px solid transparent}
.sh-nav a:hover,.sh-nav a.on{color:#fff;border-color:var(--y)}
.sh-act{display:flex;gap:10px;align-items:center}
.ib{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--ln2);color:#fff}
.ib:hover{border-color:var(--y);color:var(--y)}
.burger{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 24px;font-family:var(--fc);font-weight:700;font-size:17.5px;letter-spacing:1.2px;text-transform:uppercase;border-radius:6px;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn-y{background:var(--y);color:var(--k0)}.btn-y:hover{background:var(--y2)}
.btn-o{border:2px solid rgba(255,255,255,.85);color:#fff}.btn-o:hover{border-color:var(--y);color:var(--y)}
.btn-k{background:var(--k0);color:#fff}.btn-k:hover{background:var(--k)}
.btn.sm{height:42px;padding:0 16px;font-size:15.5px}
.btn .i{width:19px;height:19px}

.hero{position:relative;overflow:hidden;background:radial-gradient(900px 520px at 10% 0,rgba(213,175,4,.12),transparent 60%),var(--k0)}
.hero .slab{position:absolute;top:0;bottom:0;right:-10%;width:50%;background:linear-gradient(160deg,var(--y),var(--y2));transform:skewX(-11deg)}
.hero .bgw{position:absolute;left:-10px;bottom:-56px;font-family:var(--fd);font-size:250px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.06);white-space:nowrap;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:610px;padding-top:56px;padding-bottom:70px}
.eyb{display:inline-flex;align-items:center;gap:8px;font-family:var(--fc);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:14.5px;color:var(--y)}
.eyb .i{width:16px;height:16px}
.hero h1{font-family:var(--fd);font-weight:400;font-size:98px;line-height:.92;text-transform:uppercase;margin:16px 0 20px;letter-spacing:.5px}
.hero h1 span{color:var(--y);display:block}
.lead{font-size:18px;color:var(--soft);max-width:480px}
.hero .cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero .stats{display:flex;gap:34px;margin-top:40px;padding-top:24px;border-top:1px solid var(--ln)}
.stat b{display:block;font-family:var(--fd);font-weight:400;font-size:38px;line-height:1;color:#fff}
.stat span{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;font-family:var(--fc);font-weight:600}
.collage{position:relative;height:520px}
.collage .ph{position:absolute;border-radius:14px;overflow:hidden;border:5px solid var(--k0);box-shadow:0 30px 60px rgba(0,0,0,.55);cursor:pointer;background:var(--k)}
.collage .ph img{width:100%;height:100%;object-fit:cover}
.collage .c1{left:4%;top:5%;width:58%;height:80%;transform:rotate(-4deg);z-index:2}
.collage .c2{right:0;top:0;width:42%;height:43%;transform:rotate(5deg)}
.collage .c3{right:3%;bottom:3%;width:48%;height:44%;transform:rotate(-2deg);z-index:3}
.badge-p{position:absolute;left:-2%;bottom:9%;z-index:4;background:var(--k0);color:#fff;border:2px solid var(--y);border-radius:12px;padding:10px 16px;font-family:var(--fd);font-size:30px;line-height:1;transform:rotate(-6deg);text-align:center}
.badge-p small{display:block;font-family:var(--fc);font-size:12px;letter-spacing:2px;color:var(--y);font-weight:700;margin-top:3px}
.tick{background:var(--y);color:var(--k0);overflow:hidden;border-block:3px solid var(--k0);transform:rotate(-1.3deg);margin:-16px -30px 0;position:relative;z-index:3}
.tick div{display:flex;gap:26px;align-items:center;white-space:nowrap;padding:12px 0;font-family:var(--fd);font-size:26px;letter-spacing:1px;animation:tk 40s linear infinite;width:max-content}
.tick .i{width:20px;height:20px}
@keyframes tk{to{transform:translateX(-50%)}}
.sec{padding:86px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.kick{font-family:var(--fc);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:14.5px;color:var(--y);display:flex;align-items:center;gap:8px}
.kick:before{content:'';width:26px;height:3px;background:var(--y)}
.h2{font-family:var(--fd);font-weight:400;font-size:58px;line-height:.95;text-transform:uppercase;margin-top:10px}
.h2 em{font-style:normal;color:var(--y)}
.lnk{font-family:var(--fc);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--y);display:inline-flex;gap:6px;align-items:center;font-size:16px}
.lnk:hover{color:#fff}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pc{background:var(--k);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.pc:hover{border-color:var(--y2);transform:translateY(-3px)}
.pc .im{position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer;background:var(--k2)}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pc:hover .im img{transform:scale(1.04)}
.flag{position:absolute;top:12px;left:12px;background:var(--k0);color:var(--y);font-family:var(--fc);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:4px;display:flex;gap:4px;align-items:center}
.flag .i{width:13px;height:13px}
.pc .bd{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct{font-family:var(--fc);font-weight:600;font-size:13.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mu)}
.pc h3{font-family:var(--fd);font-weight:400;font-size:29px;line-height:1;text-transform:uppercase;letter-spacing:.3px;cursor:pointer}
.pc h3:hover{color:var(--y)}
.spec{font-size:14.5px;color:var(--soft);display:flex;align-items:center;gap:6px}
.spec .i{color:var(--y);width:16px;height:16px}
.pc .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--ln)}
.price{font-family:var(--fd);font-size:31px;line-height:1;color:var(--y);white-space:nowrap}
.price small{font-size:17px;color:var(--mu);margin-right:4px;font-family:var(--fc);font-weight:600}
.pc .acts{display:flex;gap:8px}
.wa-sq{width:42px;height:42px;border-radius:6px;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.wa-sq .i{width:21px;height:21px}

.about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about .pic{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:5/4}
.about .pic img{width:100%;height:100%;object-fit:cover}
.about .pic .st{position:absolute;left:0;bottom:0;background:var(--y);color:var(--k0);padding:16px 22px;font-family:var(--fd);font-size:26px;line-height:1;text-transform:uppercase}
.about p.tx{color:var(--soft);font-size:17px;margin-top:18px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.cat{background:var(--k);border:1px solid var(--ln);border-radius:12px;padding:18px 16px;cursor:pointer;text-align:left;transition:border-color .15s}
.cat:hover{border-color:var(--y)}
.cat .i{color:var(--y);width:24px;height:24px;margin-bottom:14px}
.cat b{display:block;font-family:var(--fd);font-weight:400;font-size:22px;text-transform:uppercase;line-height:1}
.cat span{font-size:13px;color:var(--mu)}
.benef{background:var(--y);color:var(--k0);position:relative;overflow:hidden}
.benef .bgw2{position:absolute;right:-20px;top:-40px;font-family:var(--fd);font-size:230px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(5,5,5,.09);pointer-events:none}
.benef .kick{color:var(--k0)}.benef .kick:before{background:var(--k0)}
.benef .h2 em{color:#fff;-webkit-text-stroke:0}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:40px}
.bi{border-top:3px solid var(--k0);padding-top:18px}
.bi .ic{width:52px;height:52px;border-radius:10px;background:var(--k0);color:var(--y);display:grid;place-items:center;margin-bottom:16px}
.bi .ic .i{width:26px;height:26px}
.bi h4{font-family:var(--fd);font-weight:400;font-size:25px;line-height:1;text-transform:uppercase;margin-bottom:8px}
.bi p{font-size:15.5px;color:#2a2304;font-weight:500}
.ctab{position:relative;border-radius:20px;overflow:hidden;background:var(--k);border:1px solid var(--ln);display:grid;grid-template-columns:1.15fr 1fr}
.ctab .tx{padding:52px 48px;position:relative;z-index:2}
.ctab .tx p{color:var(--soft);margin:14px 0 26px;font-size:16.5px;max-width:430px}
.ctab .im{position:relative;min-height:340px}
.ctab .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctab .im:before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:90px;background:var(--k);clip-path:polygon(0 0,100% 0,0 100%);z-index:1}
.igs{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px}
.igs .hd{background:var(--k);border:1px solid var(--ln);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.igs .hd b{font-family:var(--fd);font-weight:400;font-size:30px;line-height:1;text-transform:uppercase}
.igs .hd span{color:var(--mu);font-size:14px}
.igs .t{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative}
.igs .t img{width:100%;height:100%;object-fit:cover}
.igs .t .i{position:absolute;right:10px;top:10px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.sf{background:var(--k);border-top:3px solid var(--y);padding:56px 0 28px}
.sf-g{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:30px}
.sf p{color:var(--mu);font-size:14.5px;margin-top:12px;max-width:300px}
.sf h5{font-family:var(--fc);font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--y);font-size:14px;margin-bottom:14px}
.sf a.fk{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:15px;margin-bottom:10px}
.sf a.fk:hover{color:#fff}
.sf a.fk .i{width:17px;height:17px;color:var(--y)}
.sf .bt{border-top:1px solid var(--ln);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mu2)}
.fwa{position:absolute;right:22px;bottom:22px;z-index:30;width:60px;height:60px;border-radius:50%;background:var(--wa);color:#fff;display:none;place-items:center;box-shadow:0 10px 30px rgba(37,211,102,.35),0 0 0 4px rgba(5,5,5,.6)}
.fwa .i{width:31px;height:31px}
.fwa.show{display:grid}

.phero{position:relative;overflow:hidden;background:var(--k);border-bottom:1px solid var(--ln);padding:46px 0 42px}
.phero:after{content:'';position:absolute;right:-70px;top:0;bottom:0;width:250px;background:linear-gradient(160deg,var(--y),var(--y2));transform:skewX(-14deg)}
.crumb{font-size:13px;color:var(--mu);display:flex;gap:6px;align-items:center;font-family:var(--fc);letter-spacing:1px;text-transform:uppercase;font-weight:600;flex-wrap:wrap}
.crumb a:hover{color:var(--y)}
.crumb .i{width:13px;height:13px}
.phero h1{font-family:var(--fd);font-weight:400;font-size:66px;line-height:1;text-transform:uppercase;margin-top:10px;position:relative;z-index:1}
.phero h1 em{font-style:normal;color:var(--y)}
.phero p{color:var(--soft);max-width:560px;margin-top:8px;position:relative;z-index:1}

.cat-l{display:grid;grid-template-columns:250px 1fr;gap:32px;padding-top:36px;padding-bottom:84px;align-items:start}
.fbox{background:var(--k);border:1px solid var(--ln);border-radius:14px;padding:20px 16px}
.fbox h4{font-family:var(--fc);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;color:var(--y);margin:0 4px 10px}
.fbox hr{border:0;border-top:1px solid var(--ln);margin:16px 0}
.fopt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:7px;color:var(--soft);font-size:15px;width:100%;text-align:left}
.fopt:hover{background:var(--k2)}
.fopt.on{background:var(--y);color:var(--k0);font-weight:700}
.fopt em{font-style:normal;font-size:12px;background:var(--k3);color:var(--mu);border-radius:99px;padding:1px 8px}
.fopt.on em{background:rgba(0,0,0,.15);color:var(--k0)}
.tbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}

function sorted(list){
  const l = [...list];
  if (S.sort === 'pa') l.sort((x,y) => x.p - y.p);
  if (S.sort === 'pd') l.sort((x,y) => y.p - x.p);
  if (S.sort === 'az') l.sort((x,y) => x.n.localeCompare(y.n));
  return l;
}
function catList(){
  const q = S.q.trim().toLowerCase();
  return sorted(pub().filter(p => (S.cat === 'all' || p.c === S.cat) && (!q || (p.n + ' ' + p.d + ' ' + catName(p.c)).toLowerCase().includes(q))));
}
function catGrid(){
  const l = catList();
  const t = S.cat === 'all' ? 'todas las categorías' : catName(S.cat);
  return `<p class="rcount"><b>${l.length}</b> producto${l.length===1?'':'s'} en ${esc(t)}${S.q?` para “${esc(S.q)}”`:''}</p>` +
    (l.length ? `<div class="pgrid">${l.map(card).join('')}</div>`
     : `<div class="empty">${ic('search')}<b>Sin resultados</b>${S.q ? 'Prueba con otra palabra o revisa otra categoría.' : 'Esta categoría todavía no tiene productos publicados. Se cargan desde el panel administrativo.'}</div>`);
}

function sendForm(){
  const n = document.getElementById('cn'), m = document.getElementById('cm');
  n.classList.toggle('err', !n.value.trim()); m.classList.toggle('err', !m.value.trim());
  if (!n.value.trim() || !m.value.trim()) { toast('Completa los campos obligatorios'); return; }
  S.sent = true; render();
}

        <td><div class="acts">${S.catEdit===c.id ? `<button class="ab" onclick="saveCat('${c.id}')">${ic('check')}</button>` : `<button class="ab" title="Editar" onclick="S.catEdit='${c.id}';render();setTimeout(()=>document.getElementById('ce').focus(),30)">${ic('edit')}</button>`}
          <button class="ab del" title="${n?'Tiene productos asignados':'Eliminar'}" ${n?'disabled':''} onclick="delCat('${c.id}')">${ic('trash')}</button></div></td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="addc"><input class="ainp" id="nc" placeholder="Nombre de la nueva categoría" onkeydown="if(event.key==='Enter')addCat()"><button class="abtn y" onclick="addCat()">${ic('plus')} Agregar</button></div>
    </div></div></div>`;
}
function admin(){ return S.sub==='login' ? login() : S.sub==='categorias' ? admCats() : admProducts(); }

function blank(){ return { id:null, n:'', slug:'', c:CATS[0]?CATS[0].id:'', p:'', imgs:[], pr:'', prNote:'de proteína por barra', peso:'', on:true, dest:false, d:'' }; }
function newP(){ S.edit = blank(); S.sub='productos'; go('p6'); }
function editP(id){ S.edit = JSON.parse(JSON.stringify(prod(id))); S.sub='productos'; go('p6'); }
const slugify = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function prevHTML(){
  const e = S.edit;
  const p = { ...e, n:e.n||'Nombre del producto', imgs:e.imgs.length?e.imgs:['data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="4" height="3" fill="#1b1a1b"/></svg>')], id:0 };
  return card(p);
}
function serpHTML(){
  const e = S.edit;
  return `<div class="u">${DOMAIN} › productos › ${esc(slugify(e.n)||'nombre-del-producto')}</div><div class="t">${esc(e.n||'Nombre del producto')} | ${esc(BRAND)}</div><div class="d">${esc((e.d||'La descripción del producto aparece aquí.').slice(0,150))}</div>`;
}
function upd(k,v){ S.edit[k] = v; document.getElementById('pv').innerHTML = prevHTML(); document.getElementById('serp').innerHTML = serpHTML(); }
function form(){
  if (!S.edit) S.edit = JSON.parse(JSON.stringify(prod(1) || blank()));
  const e = S.edit, isNew = !e.id;
  return `<div class="adm">${aside(isNew?'nuevo':'productos')}<div class="amain">
    <div class="atop"><div><div class="crumb"><a onclick="S.sub='productos';go('p5')">Productos</a> ${ic('chev')} ${isNew?'Nuevo':'Editar'}</div><h1>${isNew?'Nuevo producto':'Editar producto'}</h1><p>Los campos con * son obligatorios.</p></div></div>
    <div class="fgrid">
      <div>
        <div class="fsec"><h3>${ic('box')} Información básica</h3>
          <div class="afl"><label>Nombre del producto <i>*</i></label><input class="ainp" id="fn" value="${esc(e.n)}" placeholder="Ej.: Protein Bar Chocomani" oninput="upd('n',this.value)"></div>
          <div class="af2">
            <div class="afl"><label>Categoría <i>*</i></label><select class="ainp" onchange="upd('c',this.value)">${CATS.map(c => `<option value="${c.id}" ${e.c===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select></div>
            <div class="afl"><label>Precio <i>*</i></label><label class="money"><span>Bs</span><input id="fp" type="number" min="0" value="${esc(e.p)}" placeholder="0" oninput="upd('p',this.value)"></label></div>
          </div>
          <div class="afl"><label>Descripción</label><textarea class="ainp" oninput="upd('d',this.value)" placeholder="Describe sabor, características y uso…">${esc(e.d)}</textarea></div>
          <div class="af2">
            <div class="afl"><label>Proteína</label><input class="ainp" value="${esc(e.pr)}" placeholder="Ej.: 25 g" oninput="upd('pr',this.value)"><span class="hint">Se muestra en la tarjeta y en la ficha.</span></div>
            <div class="afl"><label>Peso neto</label><input class="ainp" value="${esc(e.peso)}" placeholder="Ej.: 110 g" oninput="upd('peso',this.value)"></div>
          </div>
        </div>
        <div class="fsec"><h3>${ic('image')} Imágenes</h3>
          <div class="imgs" id="imgs">${imgsHTML()}</div>
          <p class="hint" style="margin-top:10px">JPG, PNG o WebP. Se optimizan automáticamente al subirlas. Haz clic en una imagen para marcarla como principal.</p>
          <input type="file" id="fimg" accept="image/*" multiple hidden onchange="addImgs(this.files)">
        </div>
      </div>
      <div>
        <div class="fsec"><h3>${ic('eye')} Publicación</h3>
          <div class="tgl" onclick="S.edit.on=!S.edit.on;this.querySelector('.sw').classList.toggle('on',S.edit.on)"><div><b>Producto activo</b><span>Visible en el catálogo</span></div><span class="sw ${e.on?'on':''}"></span></div>
          <div class="tgl" onclick="S.edit.dest=!S.edit.dest;this.querySelector('.sw').classList.toggle('on',S.edit.dest);upd('dest',S.edit.dest)"><div><b>Destacado en inicio</b><span>Aparece en “Productos destacados”</span></div><span class="sw ${e.dest?'on':''}"></span></div>
        </div>
        <div class="fsec"><h3>${ic('monitor')} Vista previa</h3><div class="prevw"><div class="lb">${ic('bolt')} Así se verá en el catálogo</div><div id="pv">${prevHTML()}</div></div></div>
        <div class="fsec"><h3>${ic('globe')} SEO básico</h3><p class="hint" style="margin-bottom:8px">Título y descripción para Google, generados a partir del producto.</p><div class="serp" id="serp">${serpHTML()}</div></div>
      </div>
    </div>
    <div class="fact">${isNew?'':`<button class="abtn red" onclick="askDel(${e.id})">${ic('trash')} Eliminar</button>`}<button class="abtn gh" onclick="S.sub='productos';go('p5')">Cancelar</button><button class="abtn y" onclick="saveP()">${ic('check')} Guardar producto</button></div>
  </div></div>`;
}
function imgsHTML(){
  return S.edit.imgs.map((s,i) => `<div class="im ${i===0?'main':''}" onclick="mainImg(${i})"><img src="${s}" alt="">${i===0?'<span class="tg">Principal</span>':''}<button class="rm" onclick="event.stopPropagation();rmImg(${i})" aria-label="Quitar">${ic('x')}</button></div>`).join('')
    + `<label class="drop" for="fimg">${ic('upload')}<span>Subir imágenes</span></label>`;
}
function refreshImgs(){ document.getElementById('imgs').innerHTML = imgsHTML(); document.getElementById('pv').innerHTML = prevHTML(); }
function mainImg(i){ const a = S.edit.imgs; a.unshift(a.splice(i,1)[0]); refreshImgs(); }
function rmImg(i){ S.edit.imgs.splice(i,1); refreshImgs(); }
function addImgs(files){
  [...files].forEach(f => { const r = new FileReader(); r.onload = () => { S.edit.imgs.push(r.result); refreshImgs(); }; r.readAsDataURL(f); });
}
function saveP(){
  const e = S.edit, fn = document.getElementById('fn'), fp = document.getElementById('fp');
  fn.classList.toggle('err', !e.n.trim()); fp.parentElement.classList.toggle('err', e.p==='' );
  if (!e.n.trim() || e.p === '') { toast('Completa nombre y precio'); return; }
  e.p = Number(e.p); e.slug = slugify(e.n);
  if (!e.imgs.length) e.imgs = ['assets/producto-1.jpg'];
  if (e.id) PRODS = PRODS.map(p => p.id === e.id ? e : p);
  else { e.id = Math.max(0, ...PRODS.map(p => p.id)) + 1; PRODS.push(e); }
  S.sub = 'productos'; go('p5'); toast(`“${e.n}” guardado`);
}
function setPrice(id,v){ const p = prod(id); p.p = Math.max(0, Number(v)||0); toast(`Precio de ${p.n} actualizado a Bs ${p.p}`); }
function togP(id){ const p = prod(id); p.on = !p.on; render(); toast(`${p.n}: ${p.on?'activo en el sitio':'oculto del sitio'}`); }
function askDel(id){ S.layer = { t:'del', id }; layer(); }
function doDel(id){ const p = prod(id); PRODS = PRODS.filter(x => x.id !== id); S.layer = null; S.sub='productos'; go('p5'); toast(`“${p.n}” eliminado`); }
function togC(id){ const c = CATS.find(c => c.id===id); c.on = !c.on; render(); }
function saveCat(id){ const v = document.getElementById('ce').value.trim(); if (v) CATS.find(c => c.id===id).n = v; S.catEdit = null; render(); toast('Categoría actualizada'); }
function addCat(){ const i = document.getElementById('nc'), v = i.value.trim(); if (!v) { i.classList.add('err'); return; }
  CATS.push({ id:slugify(v)+'-'+Date.now().toString(36), n:v, on:true }); render(); toast(`Categoría “${v}” creada`); }
function delCat(id){ CATS = CATS.filter(c => c.id !== id); render(); toast('Categoría eliminada'); }

/* =====================================================================
   GUÍA VISUAL
   ===================================================================== */
function guide(){
  const sw = [['#D5AF04','Amarillo principal','Botones y elementos destacados','#050505'],['#121112','Negro principal','Fondos y secciones','#D5AF04'],['#B39302','Amarillo sombreado','Hover, bordes y detalles','#050505'],['#050505','Negro intenso','Fondos profundos y contraste','#D5AF04']];
  return header('') + `<div class="w guide">
    <div class="kick">Partida 01 · Diseño UI/UX</div><h2 class="h2">Guía de <em>identidad visual</em></h2>
    <div class="gsec"><h3>Paleta oficial</h3><div class="sw4">${sw.map(([h,n,u,t]) => `<div class="swc"><div class="c" style="background:${h};color:${t}">${h}</div><div class="t"><b>${n}</b><code>${h}</code><span>${u}</span></div></div>`).join('')}</div></div>
    <div class="gsec"><h3>Tipografía</h3><div class="tyg">
      <div class="tyc"><div class="s" style="font-family:var(--fd);font-size:64px;text-transform:uppercase">High <span style="color:var(--y)">protein</span></div><small>Anton · Títulos y precios</small></div>
      <div class="tyc"><div class="s" style="font-family:var(--fc);font-weight:700;font-size:32px;letter-spacing:2px;text-transform:uppercase;color:var(--y)">Big flavor</div><small>Barlow Condensed · Etiquetas, menú y botones</small></div>
      <div class="tyc"><div class="s" style="font-size:17px;line-height:1.5;color:var(--soft)">Texto de lectura claro y cómodo en celular y computadora.</div><small>Barlow · Textos y formularios</small></div>
    </div></div>
    <div class="gsec"><h3>Componentes</h3><div class="cmpg">
      <div class="cmpb"><button class="btn btn-y">${ic('wa')} Pedir por WhatsApp</button><button class="btn btn-o">Ver productos</button><span class="flag" style="position:static">${ic('bolt')} Destacado</span><span class="price">${bs(15)}</span></div>
      <div style="max-width:340px">${card(prod(2))}</div>
    </div></div>
    <div class="gsec"><h3>Tono de comunicación</h3><div class="tone">
      <div class="val"><b>Energía</b><span>Mensajes cortos y directos, en mayúsculas para titulares.</span></div>
      <div class="val"><b>Fuerza</b><span>Contraste alto entre amarillo y negro, fotos grandes.</span></div>
      <div class="val"><b>Confianza</b><span>Datos reales del empaque: proteína, peso y origen.</span></div>
    </div></div>
  </div>` + footer();
}

/* =====================================================================
   CAPAS: WhatsApp, menú móvil, confirmaciones, avisos
   ===================================================================== */
function waText(id){
  const p = id ? prod(id) : null;
  if (!p) return `Hola ${BRAND} 👋\nQuiero hacer una consulta sobre sus productos.`;
  const q = S.p === 'p3' && S.cur === id ? S.qty : 1;
  return `Hola ${BRAND} 👋\nQuiero consultar por este producto:\n\n*${p.n}*\nCantidad: ${q}\nPrecio de referencia: Bs ${p.p}\n\n¿Está disponible?`;
}
function openWA(id){ S.layer = { t:'wa', id }; layer(); }
function layer(){
  const L = document.getElementById('layer');
  if (S.menu) {
    L.innerHTML = `<div class="drw" onclick="if(event.target===this){S.menu=false;layer()}"><div class="pn">
      <div class="top"><span class="logo">${logoHTML()}</span><button class="ib" onclick="S.menu=false;layer()">${ic('x')}</button></div>
      ${[['Inicio','p1'],['Productos','p2'],['Nosotros','p4'],['Contacto','p4']].map(([t,p]) => `<a class="ml" onclick="S.menu=false;go('${p}')">${t}${ic('arrow')}</a>`).join('')}
      <button class="btn btn-y" onclick="S.menu=false;openWA()">${ic('wa')} Pedir por WhatsApp</button></div></div>`;
    return;
  }
  const o = S.layer;
  if (!o) { L.innerHTML = ''; return; }
  const close = `onclick="if(event.target===this){S.layer=null;layer()}"`;
  if (o.t === 'wa') {
    const hh = '10:24';
    L.innerHTML = `<div class="ov" ${close}><div class="wa-m">
      <div class="wa-h"><span class="av">${ic('bolt')}</span><div><b>${esc(BRAND)}</b><span>Cuenta de WhatsApp de la marca</span></div><button onclick="S.layer=null;layer()" aria-label="Cerrar">${ic('x')}</button></div>
      <div class="wa-b"><div class="bub">${esc(waText(o.id)).replace(/\*(.+?)\*/g,'<b>$1</b>')}<small>${hh} ✓✓</small></div></div>
      <div class="wa-f"><div class="bx">Mensaje listo para enviar</div><span class="go">${ic('send')}</span></div>
      <div class="wa-note"><b>Así funciona:</b> en el sitio real este botón abre WhatsApp (app o web) con este mensaje ya escrito. El cliente solo presiona “Enviar”.</div>
    </div></div>`;
  }
  if (o.t === 'del') {
    const p = prod(o.id);
    L.innerHTML = `<div class="ov" ${close}><div class="mdl"><h3>¿Eliminar “${esc(p.n)}”?</h3><p>Se quitará del catálogo y del panel. Si solo quieres ocultarlo temporalmente, desactívalo.</p>
      <div class="row"><button class="abtn gh" onclick="S.layer=null;layer()">Cancelar</button><button class="abtn redf" onclick="doDel(${p.id})">${ic('trash')} Eliminar</button></div></div></div>`;
  }
}
let tT;
function toast(m){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.getElementById('device').appendChild(t); }
  t.className = 'toast'; t.innerHTML = ic('check') + esc(m);
  t.style.animation = 'none'; t.offsetHeight; t.style.animation = '';
  clearTimeout(tT); tT = setTimeout(() => t.remove(), 2600);
}

/* =====================================================================
   NAVEGACIÓN Y RENDER
   ===================================================================== */
function openP(id){ S.cur = id; S.img = 0; S.qty = 1; go('p3'); }
function go(p){
  if (p === 'p4c') p = 'p4';
  S.p = p; S.menu = false; S.layer = null;
  if (p === 'p6' && !S.edit) S.edit = JSON.parse(JSON.stringify(prod(1) || blank()));
  if (location.hash !== '#'+p && !document.body.classList.contains('shot')) history.replaceState(null,'','#'+p);
  render(); layer();
  document.getElementById('vp').scrollTop = 0;
}
function setDev(d){ S.dev = d; render(); }
function render(){
  const sc = SCREENS[S.p];
  document.getElementById('stage').dataset.device = S.dev;
  document.getElementById('pnav').innerHTML = Object.entries(SCREENS).map(([k,v],i) =>
    (k==='p5'||k==='p7' ? '<i class="sep"></i>' : '') + `<button class="${S.p===k?'on':''}" onclick="go('${k}')"><span>${v.n}</span>${v.nav}</button>`).join('');
  document.getElementById('dev').innerHTML =
    `<button class="${S.dev==='desktop'?'on':''}" onclick="setDev('desktop')">${ic('monitor')}Escritorio</button><button class="${S.dev==='mobile'?'on':''}" onclick="setDev('mobile')">${ic('phone')}Móvil</button>`;
  let ctrl = '';
  if (S.p === 'p3') ctrl = `<span class="lbl">Producto:</span><div class="seg">${pub().map(p => `<button class="${S.cur===p.id?'on':''}" onclick="openP(${p.id})">${esc(p.n.replace('Protein Bar ',''))}</button>`).join('')}</div>`;
  if (S.p === 'p5') ctrl = `<span class="lbl">Vista:</span><div class="seg">${[['login','Inicio de sesión'],['productos','Productos'],['categorias','Categorías']].map(([k,t]) => `<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';render()">${t}</button>`).join('')}</div>`;
  if (S.p === 'p6') ctrl = `<span class="lbl">Modo:</span><div class="seg"><button class="${S.edit&&S.edit.id?'on':''}" onclick="editP(${(PRODS[0]||{}).id||1})">Editar existente</button><button class="${S.edit&&!S.edit.id?'on':''}" onclick="newP()">Nuevo producto</button></div>`;
  document.getElementById('phead').innerHTML = `<div class="ph-t"><span class="ph-n">0${sc.n}</span><div><h1>${sc.t}</h1><p>${sc.d}</p><span class="part">${sc.part}</span><div class="chips">${sc.chips.map(c => `<span>${c}</span>`).join('')}</div></div></div><div class="ph-ctrl">${ctrl}</div>`;
  let u = sc.url;
  if (S.p === 'p3') u += (prod(S.cur)||{}).slug || '';
  if (S.p === 'p6') u += S.edit && S.edit.id ? 'editar/' + S.edit.id : 'nuevo';
  if (S.p === 'p5' && S.sub === 'categorias') u += '/categorias';
  if (S.p === 'p5' && S.sub === 'login') u += '/login';
  document.getElementById('url').innerHTML = `${ic('lock')}${DOMAIN}${u}`;
  const fn = { p1:home, p2:catalog, p3:detail, p4:contact, p5:admin, p6:form, p7:guide }[S.p];
  document.getElementById('scr').innerHTML = fn();
  const fwa = document.getElementById('fwa');
  fwa.innerHTML = ic('wa'); fwa.classList.toggle('show', ['p1','p2','p3','p4','p7'].includes(S.p));
}

/* Inicio: hash (#p1…#p7) o modo captura (?shot=1&p=…&dev=…) */
(function init(){
  document.getElementById('pblogo').innerHTML = logoHTML();
  const Q = new URLSearchParams(location.search);
  const h = location.hash.replace('#','');
  if (SCREENS[h]) S.p = h;
  if (Q.get('p') && SCREENS[Q.get('p')]) S.p = Q.get('p');
  if (Q.get('dev')) S.dev = Q.get('dev');
  if (Q.get('sub')) S.sub = Q.get('sub');
  if (Q.get('cur')) S.cur = +Q.get('cur');
  if (Q.get('cat')) S.cat = Q.get('cat');
  if (Q.get('new')) S.edit = blank();
  if (Q.get('shot')) {
    document.body.classList.add('shot');
    document.body.style.setProperty('--shot-w', (S.dev === 'mobile' ? 390 : +(Q.get('w')||1440)) + 'px');
    if (Q.get('h')) { document.body.classList.add('fixh'); document.body.style.setProperty('--shot-h', Q.get('h') + 'px'); }
  }
  go(S.p);
  if (Q.get('modal') === 'wa') openWA(S.cur);
  if (Q.get('modal') === 'menu') { S.menu = true; layer(); }
  if (Q.get('sent')) { S.sent = true; render(); }
  if (Q.get('to')) document.fonts.ready.then(() => { const vp = document.getElementById('vp'), el = document.getElementById(Q.get('to'));
    if (el) vp.scrollTop = el.getBoundingClientRect().top - vp.getBoundingClientRect().top - 16; });
  window.addEventListener('hashchange', () => { const k = location.hash.replace('#',''); if (SCREENS[k] && k !== S.p) go(k); });
  document.fonts.ready.then(() => setTimeout(() => { document.body.dataset.h = Math.ceil(document.getElementById('device').scrollHeight); }, 300));
})();
</script>
